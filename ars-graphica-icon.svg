<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="113 113 734 734">
  <title>Ars Graphica 图标</title>
  <desc>透明底方形图标：刻度环、菱形与居中徽记构成制图罗盘，中央为 A 字几何字母组合。</desc>
  <style>
    svg {
      /* 方案一：雾蓝燕麦 */
      --surface: #F7F6F3;
      --surface-muted: #EFEDE8;
      --text: #2E2C29;
      --text-muted: #75716A;
      --border: #D9D5CD;
      --brand: #5F7887;
      --brand-soft: #EDF1F3;
      --brand-soft-strong: #DCE4E8;
      --brand-text: #35434C;
      --brand-on: #FFFFFF;
      --chart-series-1: #4A5F6C;
      --chart-series-2: #ACBCC5;
      --chart-series-3: #78909D;
      --chart-series-4: #A89A80;
      --chart-other: #C4C1BB;
      --accent: #A48F77;
      --accent-soft: #F2EDE4;
      --accent-text: #5D5140;
    }
    .keyline { fill: none; stroke: var(--text); stroke-width: 2.5; }
    .disc { fill: var(--surface); stroke: var(--border); stroke-width: 4; }
    .axis { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 10; }
    .tick-minor { stroke: var(--text-muted); stroke-width: 3; }
    .tick-major { stroke: var(--brand); stroke-width: 5; }
    .ring-main { fill: none; stroke: var(--brand); stroke-width: 4; }
    .diamond { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 5; stroke-linejoin: round; }
    .diamond-dot { fill: var(--chart-series-1); }
    .inner-disc { fill: var(--accent-soft); }
    .halo { fill: none; stroke: var(--brand-soft-strong); stroke-width: 7; }
    .inner-ring { fill: none; stroke: var(--accent-text); stroke-width: 2.5; }
    .medallion { fill: var(--brand); }
    .monogram {
      fill: none;
      stroke: var(--brand-on);
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .monogram-dot { fill: var(--brand-on); }
  </style>

  <defs>
    <g id="tickMinor">
      <line class="tick-minor" x1="480" y1="194" x2="480" y2="178"/>
    </g>
    <g id="tickMajor">
      <line class="tick-major" x1="480" y1="204" x2="480" y2="176"/>
    </g>
  </defs>

  <circle class="keyline" cx="480" cy="480" r="326"/>

  <g id="dial">
    <circle class="disc" cx="480" cy="480" r="310"/>
    <path class="axis" d="M170 480 H790 M480 170 V790"/>

    <use href="#tickMajor" transform="rotate(0 480 480)"/>
    <use href="#tickMinor" transform="rotate(10 480 480)"/>
    <use href="#tickMinor" transform="rotate(20 480 480)"/>
    <use href="#tickMajor" transform="rotate(30 480 480)"/>
    <use href="#tickMinor" transform="rotate(40 480 480)"/>
    <use href="#tickMinor" transform="rotate(50 480 480)"/>
    <use href="#tickMajor" transform="rotate(60 480 480)"/>
    <use href="#tickMinor" transform="rotate(70 480 480)"/>
    <use href="#tickMinor" transform="rotate(80 480 480)"/>
    <use href="#tickMajor" transform="rotate(90 480 480)"/>
    <use href="#tickMinor" transform="rotate(100 480 480)"/>
    <use href="#tickMinor" transform="rotate(110 480 480)"/>
    <use href="#tickMajor" transform="rotate(120 480 480)"/>
    <use href="#tickMinor" transform="rotate(130 480 480)"/>
    <use href="#tickMinor" transform="rotate(140 480 480)"/>
    <use href="#tickMajor" transform="rotate(150 480 480)"/>
    <use href="#tickMinor" transform="rotate(160 480 480)"/>
    <use href="#tickMinor" transform="rotate(170 480 480)"/>
    <use href="#tickMajor" transform="rotate(180 480 480)"/>
    <use href="#tickMinor" transform="rotate(190 480 480)"/>
    <use href="#tickMinor" transform="rotate(200 480 480)"/>
    <use href="#tickMajor" transform="rotate(210 480 480)"/>
    <use href="#tickMinor" transform="rotate(220 480 480)"/>
    <use href="#tickMinor" transform="rotate(230 480 480)"/>
    <use href="#tickMajor" transform="rotate(240 480 480)"/>
    <use href="#tickMinor" transform="rotate(250 480 480)"/>
    <use href="#tickMinor" transform="rotate(260 480 480)"/>
    <use href="#tickMajor" transform="rotate(270 480 480)"/>
    <use href="#tickMinor" transform="rotate(280 480 480)"/>
    <use href="#tickMinor" transform="rotate(290 480 480)"/>
    <use href="#tickMajor" transform="rotate(300 480 480)"/>
    <use href="#tickMinor" transform="rotate(310 480 480)"/>
    <use href="#tickMinor" transform="rotate(320 480 480)"/>
    <use href="#tickMajor" transform="rotate(330 480 480)"/>
    <use href="#tickMinor" transform="rotate(340 480 480)"/>
    <use href="#tickMinor" transform="rotate(350 480 480)"/>

    <circle class="ring-main" cx="480" cy="480" r="276"/>

    <path class="diamond" d="M728 480 L480 728 L232 480 L480 232 Z"/>
    <circle class="diamond-dot" cx="728" cy="480" r="12"/>
    <circle class="diamond-dot" cx="480" cy="728" r="12"/>
    <circle class="diamond-dot" cx="232" cy="480" r="12"/>
    <circle class="diamond-dot" cx="480" cy="232" r="12"/>

    <circle class="inner-disc" cx="480" cy="480" r="210"/>

    <circle class="halo" cx="480" cy="480" r="166"/>
    <circle class="inner-ring" cx="480" cy="480" r="156"/>

    <circle class="medallion" cx="480" cy="480" r="150"/>
    <path class="monogram" d="M480 358 L412 560 M480 358 L548 560 M430 506 L530 506"/>
    <circle class="monogram-dot" cx="578" cy="548" r="14"/>
  </g>
</svg>
