    <rect class="f-series-1" x="110" y="130" width="14" height="90"/>
    <rect class="f-accent" x="110" y="252" width="14" height="130"/>
    <rect class="f-series-3" x="110" y="414" width="14" height="150"/>
    <rect class="f-series-2" x="110" y="596" width="14" height="110"/>
  </g>

  <g id="nodes-col2">
    <rect class="f-brand" x="470" y="130" width="14" height="145"/>
    <rect class="node-neutral f-soft" x="470" y="307" width="14" height="175"/>
    <rect class="node-neutral f-soft" x="470" y="514" width="14" height="160"/>
  </g>

  <g id="nodes-col3">
    <rect class="f-brand" x="790" y="130" width="14" height="120"/>
    <rect class="node-neutral f-muted" x="790" y="282" width="14" height="105"/>
    <rect class="node-neutral f-muted" x="790" y="419" width="14" height="110"/>
    <rect class="node-neutral f-muted" x="790" y="561" width="14" height="90"/>
    <rect class="node-neutral f-muted" x="790" y="683" width="14" height="55"/>
  </g>

  <g id="focus-label">
    <text class="t-focus-num" x="637" y="176" text-anchor="middle">105 人</text>
    <text class="t-focus-sub" x="637" y="198" text-anchor="middle">占深造者 72%</text>
  </g>

  <g id="labels-col1">
    <text class="t-label" x="102" y="171" text-anchor="end">哲学</text>
    <text class="t-count" x="102" y="191" text-anchor="end">90 人</text>
    <text class="t-label" x="102" y="313" text-anchor="end">历史学</text>
    <text class="t-count" x="102" y="333" text-anchor="end">130 人</text>
    <text class="t-label" x="102" y="485" text-anchor="end">中国文学</text>
    <text class="t-count" x="102" y="505" text-anchor="end">150 人</text>
    <text class="t-label" x="102" y="647" text-anchor="end">语言学</text>
    <text class="t-count" x="102" y="667" text-anchor="end">110 人</text>
  </g>

  <g id="labels-col2">
    <text class="t-branch-focus" x="477" y="120" text-anchor="middle">学术深造 · 145 人</text>
    <text class="t-branch" x="477" y="295" text-anchor="middle">应用型硕士 · 175 人</text>
    <text class="t-branch" x="477" y="502" text-anchor="middle">直接就业 · 160 人</text>
  </g>

  <g id="labels-col3">
    <text class="t-label" x="816" y="186">高等教育与科研</text>
    <text class="t-count" x="816" y="206">120 人</text>
    <text class="t-label" x="816" y="330">中学教育</text>
    <text class="t-count" x="816" y="350">105 人</text>
    <text class="t-label" x="816" y="470">出版与传媒</text>
    <text class="t-count" x="816" y="490">110 人</text>
