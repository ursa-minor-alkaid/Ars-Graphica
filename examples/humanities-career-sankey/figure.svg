<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900">
  <title>人文社科毕业生的教育与职业流动</title>
  <desc>桑基图示例：某届人文社科本科毕业生（示例数据 n=480）从本科专业经毕业路径到十年后职业领域的流动，流带宽度与人数成比例（1 人 = 1 单位），赭黄主线为学术传承焦点路径。</desc>
  <style>
    svg {
      /* ===== 方案五：赭黄橄榄 ===== */
      --surface:            #F7F6F1;
      --surface-muted:      #EFEEE8;
      --text:               #2E2D28;
      --text-muted:         #73706B;
      --border:             #DAD7CE;

      --brand:              #94894B;
      --brand-soft:         #F4F2E9;
      --brand-soft-strong:  #EDEBDE;
      --brand-text:         #565136;
      --brand-on:           #FFFFFF;

      --chart-series-1:     #726940;
      --chart-series-2:     #CFCBB4;
      --chart-series-3:     #ABA26D;
      --chart-series-4:     #969C64;
      --chart-other:        #C3C3C0;

      --accent:             #8A9060;
      --accent-soft:        #F0F2E8;
      --accent-text:        #565A3A;

      --success:            #7C9473;
      --warning:            #A79F7E;
      --danger:             #A17974;

      --radius: 8px;
      --radius-card: 12px;
      --radius-full: 999px;
      --spacer-4: 4px;
      --spacer-8: 8px;
      --spacer-12: 12px;
      --spacer-16: 16px;
      --spacer-20: 20px;
      --spacer-24: 24px;
      --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --weight-regular: 400;
      --weight-medium: 500;
      --weight-strong: 600;
      --text-caption: 12px/18px;
      --text-body: 14px/20px;
      --text-title: 16px/24px;
      --text-code: 13px/20px;
    }
    .t-title    { font-family: var(--font-sans); font-size: 16px; font-weight: var(--weight-strong);  fill: var(--text); }
    .t-subtitle { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-regular); fill: var(--text-muted); }
    .t-stage    { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-medium);  fill: var(--text-muted); }
    .t-badge    { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-medium);  fill: var(--brand-text); }
    .t-label    { font-family: var(--font-sans); font-size: 14px; font-weight: var(--weight-medium);  fill: var(--text); }
    .t-count    { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-regular); fill: var(--text-muted); }
    .t-branch   { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-medium);  fill: var(--text); }
    .t-branch-focus { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-medium); fill: var(--brand-text); }
    .t-focus-num { font-family: var(--font-metric); font-size: 16px; font-weight: var(--weight-strong); fill: var(--brand-on); }
    .t-focus-sub { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-regular); fill: var(--brand-on); }
    .t-legend   { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-regular); fill: var(--text-muted); }
    .t-note     { font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-regular); fill: var(--accent-text); }

    /* 流带三层：左段按来源着色、右段非焦点降权、焦点主线实色 */
    .flow-l { stroke: var(--surface); stroke-width: 0.75; fill-opacity: 0.45; }
    .flow-n { stroke: var(--surface); stroke-width: 0.75; fill-opacity: 0.32; }
    .flow-f { stroke: var(--surface); stroke-width: 0.75; fill-opacity: 1; }
    .f-series-1 { fill: var(--chart-series-1); }
    .f-series-2 { fill: var(--chart-series-2); }
    .f-series-3 { fill: var(--chart-series-3); }
    .f-accent   { fill: var(--accent); }
    .f-brand    { fill: var(--brand); }
    .f-neutral  { fill: var(--text-muted); }
    .f-soft     { fill: var(--brand-soft-strong); }
    .f-muted    { fill: var(--surface-muted); }
    .node-neutral { stroke: var(--border); stroke-width: 1.5; }
  </style>

  <rect width="960" height="900" fill="var(--surface)"/>

  <g id="title">
    <text class="t-title" x="60" y="52">人文社科毕业生的教育与职业流动</text>
    <text class="t-subtitle" x="60" y="76">本科专业 → 毕业路径 → 职业领域 · 桑基图（Sankey / Alluvial）· 流带宽度与人数成比例</text>
  </g>

  <g id="badge">
    <rect x="790" y="40" width="130" height="26" rx="13" fill="var(--brand-soft)"/>
    <text class="t-badge" x="855" y="57" text-anchor="middle">示例数据 · n = 480</text>
  </g>

