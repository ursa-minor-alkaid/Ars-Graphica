  <g id="note">
    <rect x="60" y="800" width="840" height="52" rx="8" fill="var(--accent-soft)"/>
    <text class="t-note" x="76" y="821">示例数据：虚构追踪调查，展示某校人文学院一届本科毕业生（n = 480，单位：人）的教育与职业流动。</text>
    <text class="t-note" x="76" y="843">读法：颜色标记本科专业来源；右段灰调流带为非焦点去向；赭黄主线为学术传承路径（105 人，占深造者 72%）。</text>
  </g>
