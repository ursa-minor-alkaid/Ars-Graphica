    <text class="t-stage" x="117" y="98" text-anchor="middle">本科专业</text>
    <text class="t-stage" x="477" y="98" text-anchor="middle">毕业路径</text>
    <text class="t-stage" x="797" y="98" text-anchor="middle">职业领域 · 毕业十年后</text>
  </g>

