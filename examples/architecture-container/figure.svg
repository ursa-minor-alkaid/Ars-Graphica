<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'SF Pro Text','PingFang SC',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>数据处理流水线</title>
  <desc>容器嵌套架构图示例：外部输入进入处理集群，经校验器与合格判定后由转换器写入存储器，结果输出到外部报表服务；判定不通过的数据转入驳回队列</desc>
  <style>
    svg {
      /* 配色取自 tokens/visual-tokens.md 方案一「雾蓝燕麦」 */
      --surface: #F7F6F3;
      --surface-muted: #EFEDE8;
      --text: #2E2C29;
      --text-muted: #75716A;
      --border: #D9D5CD;
      --brand: #5F7887;
      --brand-soft-strong: #DCE4E8;
      --brand-text: #35434C;
    }
    svg { background: var(--surface); }
    .boundary {
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
    }
    .module {
      fill: var(--surface-muted);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .gate {
      fill: var(--surface-muted);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .module-focus {
      fill: var(--brand-soft-strong);
      stroke: var(--brand);
      stroke-width: 2;
    }
    .external {
      fill: var(--surface);
      stroke: var(--text-muted);
      stroke-width: 1.5;
    }
    .link {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      marker-end: url(#arrow);
    }
    .link-exception {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 5 5;
      marker-end: url(#arrow);
    }
    .link-main {
      stroke: var(--brand);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      marker-end: url(#arrow-brand);
    }
    .arrowhead { fill: var(--text-muted); }
    .arrowhead-brand { fill: var(--brand); }
    .title {
      fill: var(--text);
      font-size: 16px;
      font-weight: 500;
    }
    .node-title {
      fill: var(--text);
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }
    .node-subtitle {
      fill: var(--text-muted);
      font-size: 12px;
      text-anchor: middle;
    }
    .focus-title { fill: var(--brand-text); }
    .boundary-label {
      fill: var(--text-muted);
      font-size: 12px;
    }
    .capsule {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1;
    }
    .tag {
      fill: var(--text-muted);
      font-size: 12px;
      text-anchor: middle;
    }
    .legend-box { fill: var(--surface-muted); }
    .legend-text {
      fill: var(--text-muted);
      font-size: 12px;
    }
    .swatch-module {
      fill: var(--surface-muted);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .swatch-focus {
      fill: var(--brand-soft-strong);
      stroke: var(--brand);
      stroke-width: 1.5;
    }
    .swatch-external {
      fill: var(--surface);
      stroke: var(--text-muted);
      stroke-width: 1.5;
    }
    .swatch-link {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .swatch-link-exception {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 5 5;
    }
    .swatch-link-main {
      stroke: var(--brand);
      stroke-width: 1.5;
      stroke-linecap: round;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowhead" d="M1 1 L7 4 L1 7 Z"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowhead-brand" d="M1 1 L7 4 L1 7 Z"/>
    </marker>
  </defs>

  <text class="title" x="480" y="60" text-anchor="middle">数据处理流水线</text>

  <g id="external-in">
    <rect class="external" x="50" y="204" width="110" height="56" rx="8"/>
    <text class="node-title" x="105" y="237">用户上传</text>
  </g>

  <g id="cluster">
    <rect class="boundary" x="225" y="140" width="510" height="324" rx="12"/>
    <text class="boundary-label" x="245" y="172">处理集群</text>
    <g id="module-validator">
      <rect class="module" x="265" y="200" width="96" height="64" rx="8"/>
      <text class="node-title" x="313" y="228">校验器</text>
      <text class="node-subtitle" x="313" y="248">schema 校验</text>
    </g>
    <g id="gate-quality">
      <path class="gate" d="M 487 200 L 532 228 Q 539 232 532 236 L 487 264 Q 480 268 473 264 L 428 236 Q 421 232 428 228 L 473 200 Q 480 196 487 200 Z"/>
      <text class="node-title" x="480" y="237">合格？</text>
    </g>
    <g id="module-transformer">
      <rect class="module" x="599" y="200" width="96" height="64" rx="8"/>
      <text class="node-title" x="647" y="228">转换器</text>
      <text class="node-subtitle" x="647" y="248">格式归一化</text>
    </g>
    <g id="module-storage">
      <rect class="module-focus" x="432" y="360" width="96" height="64" rx="8"/>
      <text class="node-title focus-title" x="480" y="388">存储器</text>
      <text class="node-subtitle" x="480" y="408">主存储</text>
    </g>
  </g>

  <g id="external-reject">
    <rect class="external" x="50" y="480" width="110" height="56" rx="8"/>
    <text class="node-title" x="105" y="513">驳回队列</text>
  </g>

  <g id="external-out">
    <rect class="external" x="800" y="364" width="110" height="56" rx="8"/>
    <text class="node-title" x="855" y="397">报表服务</text>
  </g>

  <g id="edges">
    <path class="link" d="M 160 232 L 263 232"/>
    <path class="link" d="M 361 232 L 419 232"/>
    <path class="link" d="M 539 232 L 597 232"/>
    <g id="edge-label-pass">
      <rect class="capsule" x="554" y="199" width="28" height="22" rx="11"/>
      <text class="tag" x="568" y="214">是</text>
    </g>
    <path class="link-exception" d="M 480 268 L 480 308 Q 480 328 460 328 L 125 328 Q 105 328 105 348 L 105 478"/>
    <g id="edge-label-reject">
      <rect class="capsule" x="386" y="296" width="28" height="22" rx="11"/>
      <text class="tag" x="400" y="311">否</text>
    </g>
    <path class="link" d="M 647 264 L 647 280 Q 647 300 627 300 L 520 300 Q 500 300 500 320 L 500 358"/>
    <path class="link-main" d="M 528 392 L 798 392"/>
    <g id="edge-label-result">
      <rect class="capsule" x="641" y="359" width="44" height="22" rx="11"/>
      <text class="tag" x="663" y="374">结果</text>
    </g>
  </g>

  <g id="legend">
    <rect class="legend-box" x="208" y="568" width="544" height="36" rx="8"/>
    <rect class="swatch-module" x="228" y="580" width="12" height="12" rx="3"/>
    <text class="legend-text" x="246" y="590">中性模块</text>
    <rect class="swatch-focus" x="314" y="580" width="12" height="12" rx="3"/>
    <text class="legend-text" x="332" y="590">焦点模块</text>
    <rect class="swatch-external" x="400" y="580" width="12" height="12" rx="3"/>
    <text class="legend-text" x="418" y="590">外部系统</text>
    <line class="swatch-link" x1="486" y1="586" x2="508" y2="586"/>
    <text class="legend-text" x="514" y="590">依赖</text>
    <line class="swatch-link-exception" x1="558" y1="586" x2="580" y2="586"/>
    <text class="legend-text" x="586" y="590">异常路径</text>
    <line class="swatch-link-main" x1="654" y1="586" x2="676" y2="586"/>
    <text class="legend-text" x="682" y="590">主数据流</text>
  </g>
</svg>
